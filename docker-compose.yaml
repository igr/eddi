
services:
  db:
    image: postgres:18-alpine
    container_name: eddi-postgres
    environment:
      POSTGRES_USER: eddi_user
      POSTGRES_PASSWORD: eddi_password
      POSTGRES_DB: eddi
    ports:
      - "7432:5432"
    volumes:
      # postgres 18+ wants a single mount here, not at .../data
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eddi_user -d eddi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
